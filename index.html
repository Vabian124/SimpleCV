<!DOCTYPE html>
<!-- CC0-1.0 — https://creativecommons.org/publicdomain/zero/1.0/ -->
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blok-editor</title>
    <script src="vendor/dompdf.min.js"></script>
    <script src="vendor/pdf-lib.min.js"></script>
    <script src="vendor/Sortable.min.js"></script>
    <script src="vendor/fonts.js"></script>
    <link rel="stylesheet" href="vendor/cropper.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <noscript>
        <p class="setup-lead">Deze editor heeft scripts nodig. Sta scripts toe voor dit bestand en open index.html opnieuw. This editor needs scripts. Allow scripts for this file, then open index.html again.</p>
    </noscript>
    <section id="view-setup" class="setup">
        <div class="setup-top">
            <p class="kicker" id="setup-kicker"></p>
            <div class="setup-dots" id="setup-dots" aria-hidden="true"><span></span><span></span><span></span></div>
            <div class="lang-switch" aria-label="Language">
                <button type="button" data-lang="nl">NL</button>
                <button type="button" data-lang="en">EN</button>
            </div>
        </div>

        <div class="setup-step" data-setup-step="1">
            <h1 id="setup-title-1" data-i18n="setup.title1"></h1>
            <p class="setup-lead" data-i18n="setup.hint1"></p>
            <div class="kind-grid">
                <button type="button" class="kind-card" data-kind="cv">
                    <span class="choice-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M8 13h8"/><path d="M8 17h5"/></svg>
                    </span>
                    <span class="mini-doc mini-cv" aria-hidden="true"><span class="mini-side"></span><span class="mini-main"><i></i><i></i><i class="short"></i></span></span>
                    <span class="card-kicker" data-i18n="setup.cv"></span>
                    <span class="card-copy" data-i18n="setup.cvHint"></span>
                </button>
                <button type="button" class="kind-card" data-kind="letter">
                    <span class="choice-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                    </span>
                    <span class="mini-doc mini-letter" aria-hidden="true"><span class="mini-main"><i class="short right"></i><i></i><i></i><i class="sign"></i></span></span>
                    <span class="card-kicker" data-i18n="setup.letter"></span>
                    <span class="card-copy" data-i18n="setup.letterHint"></span>
                </button>
            </div>
            <p class="setup-import"><button type="button" class="btn" id="setup-import" data-i18n="ui.import"></button></p>
        </div>

        <div class="setup-step" data-setup-step="2" hidden>
            <div id="setup-source">
            <h1 data-i18n="setup.title2"></h1>
            <p class="setup-lead" data-i18n="setup.hint2"></p>
            <div class="choice-list">
                <button type="button" class="choice-card is-featured" data-source="guided">
                    <span class="choice-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
                    </span>
                    <span>
                        <span class="card-kicker" data-i18n="setup.guided"></span>
                        <span class="card-copy" data-i18n="setup.guidedHint"></span>
                    </span>
                </button>
                <button type="button" class="choice-card" data-source="blank">
                    <span class="choice-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 18v-6"/><path d="M9 15h6"/></svg>
                    </span>
                    <span>
                        <span class="card-kicker" data-i18n="setup.blank"></span>
                        <span class="card-copy" data-i18n="setup.blankHint"></span>
                    </span>
                </button>
                <button type="button" class="choice-card" data-source="paste">
                    <span class="choice-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4"/><path d="M12 16h4"/><path d="M8 11h.01"/><path d="M8 16h.01"/></svg>
                    </span>
                    <span>
                        <span class="card-kicker" data-i18n="setup.paste"></span>
                        <span class="card-copy" data-i18n="setup.pasteHint"></span>
                    </span>
                </button>
                <button type="button" class="choice-card" data-source="demo">
                    <span class="choice-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </span>
                    <span>
                        <span class="card-kicker" data-i18n="setup.demo"></span>
                        <span class="card-copy" data-i18n="setup.demoHint"></span>
                    </span>
                </button>
                <button type="button" class="choice-card" data-source="model">
                    <span class="choice-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 15.5A2 2 0 0 0 8.5 14.1L2.4 12.5a.5.5 0 0 1 0-1L8.5 9.9A2 2 0 0 0 9.9 8.5l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/></svg>
                    </span>
                    <span>
                        <span class="card-kicker" data-i18n="setup.model"></span>
                        <span class="card-copy" data-i18n="setup.modelHint"></span>
                    </span>
                </button>
            </div>
            </div>
            <div id="setup-paste-wrap" class="paste-wrap" hidden>
                <textarea id="setup-paste" rows="8" lang="nl" data-i18n-placeholder="setup.pastePlaceholder"></textarea>
            </div>
            <div id="setup-guide" class="guide-panel" hidden></div>
            <div id="setup-model" class="paste-wrap" hidden>
                <h2 data-i18n="setup.model"></h2>
                <p class="setup-lead" data-i18n="setup.modelLead"></p>
                <div class="copy-modes">
                    <button type="button" class="choice-card" data-copy="guide">
                        <span>
                            <span class="card-kicker" data-i18n="setup.copyGuide"></span>
                            <span class="card-copy" data-i18n="setup.copyGuideHint"></span>
                        </span>
                    </button>
                    <button type="button" class="choice-card" data-copy="plain">
                        <span>
                            <span class="card-kicker" data-i18n="setup.copyPlain"></span>
                            <span class="card-copy" data-i18n="setup.copyPlainHint"></span>
                        </span>
                    </button>
                    <button type="button" class="choice-card" data-copy="advanced">
                        <span>
                            <span class="card-kicker" data-i18n="setup.copyAdvanced"></span>
                            <span class="card-copy" data-i18n="setup.copyAdvancedHint"></span>
                        </span>
                    </button>
                </div>
                <p class="note" data-i18n="setup.modelBox"></p>
                <textarea id="setup-model-text" rows="16" spellcheck="false"></textarea>
                <div class="guide-actions">
                    <button type="button" class="btn" id="setup-model-run" data-i18n="guide.formatModel"></button>
                </div>
                <p id="setup-message" class="note" hidden></p>
            </div>
        </div>

        <div class="setup-step" data-setup-step="3" hidden>
            <h1 data-i18n="setup.title3"></h1>
            <p class="setup-lead" data-i18n="setup.hint3"></p>
            <div class="palette-layout">
                <div class="choice-list">
                    <button type="button" class="choice-card palette-card" data-palette="zakelijk">
                        <span class="chip-row" aria-hidden="true"><i style="background:#1e293b"></i><i style="background:#ffffff"></i><i style="background:#0284c7"></i></span>
                        <span>
                            <span class="card-kicker" data-i18n="setup.zakelijk"></span>
                            <span class="card-copy" data-i18n="setup.zakelijkHint"></span>
                        </span>
                    </button>
                    <button type="button" class="choice-card palette-card" data-palette="groen">
                        <span class="chip-row" aria-hidden="true"><i style="background:#0b1d16"></i><i style="background:#ffffff"></i><i style="background:#047857"></i></span>
                        <span>
                            <span class="card-kicker" data-i18n="setup.groen"></span>
                            <span class="card-copy" data-i18n="setup.groenHint"></span>
                        </span>
                    </button>
                    <button type="button" class="choice-card palette-card" data-palette="minimal">
                        <span class="chip-row" aria-hidden="true"><i style="background:#f4f4f5"></i><i style="background:#ffffff"></i><i style="background:#18181b"></i></span>
                        <span>
                            <span class="card-kicker" data-i18n="setup.minimal"></span>
                            <span class="card-copy" data-i18n="setup.minimalHint"></span>
                        </span>
                    </button>
                    <button type="button" class="choice-card palette-card" data-palette="custom" id="setup-custom-toggle">
                        <span class="choice-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 0 0 20c.9 0 1.6-.7 1.6-1.7 0-.4-.2-.8-.4-1.1-.3-.3-.5-.7-.5-1.1a1.6 1.6 0 0 1 1.7-1.7h2c3 0 5.6-2.5 5.6-5.5C21.9 6 17.5 2 12 2z"/><circle cx="7.5" cy="10.5" r="1" fill="currentColor"/><circle cx="10.5" cy="7" r="1" fill="currentColor"/><circle cx="14.5" cy="7" r="1" fill="currentColor"/></svg>
                        </span>
                        <span>
                            <span class="card-kicker" data-i18n="setup.custom"></span>
                            <span class="card-copy" data-i18n="setup.customHint"></span>
                        </span>
                    </button>
                    <div id="setup-custom" class="custom-palette" hidden>
                        <label class="swatch"><span data-i18n="setup.sidebar"></span><input id="setup-sidebar" type="color" value="#1e293b"></label>
                        <label class="swatch"><span data-i18n="setup.accent"></span><input id="setup-accent" type="color" value="#0284c7"></label>
                        <label class="swatch"><span data-i18n="setup.page"></span><input id="setup-page" type="color" value="#ffffff"></label>
                        <label class="swatch"><span data-i18n="setup.text"></span><input id="setup-text" type="color" value="#1e293b"></label>
                    </div>
                    <p id="setup-contrast" class="note contrast-note" hidden></p>
                </div>
                <div id="palette-preview" class="palette-preview" aria-hidden="true">
                    <div class="pp-side"><b></b><i></i><i></i><i></i></div>
                    <div class="pp-main"><b></b><i></i><i></i><i class="short"></i></div>
                </div>
            </div>
        </div>

        <p id="setup-replace-note" class="note" hidden data-i18n="ui.replaceNote"></p>
        <footer class="setup-nav">
            <button type="button" class="btn" id="setup-return" data-i18n="ui.backToDoc" hidden></button>
            <button type="button" class="btn" id="setup-back" data-i18n="setup.back"></button>
            <button type="button" class="btn" id="setup-continue" data-i18n="setup.next" hidden></button>
            <button type="button" class="btn-primary" id="setup-generate" data-i18n="setup.generate" hidden></button>
        </footer>
    </section>

    <div id="studio" class="studio" hidden>
        <header id="topbar" class="topbar"></header>
        <div class="studio-body">
            <aside id="library" class="library"></aside>
            <div class="preview" id="preview">
                <div id="page-chip" class="page-chip"></div>
                <div id="studio-stage">
                    <div class="sheet-zoom" id="stage">
                        <div id="stage-scale">
                        <div class="guides" id="guides"></div>
                        <article class="sheet" id="sheet">
                            <aside class="col sidebar" id="col-sidebar"></aside>
                            <div class="col main" id="col-main"></div>
                        </article>
                        </div>
                    </div>
                </div>
                <div class="stage-tools" id="stage-tools">
                    <button type="button" class="btn" id="zoom-fit" data-i18n="ui.fit"></button>
                    <span id="zoom-slot"></span>
                    <span id="zoom-value">100%</span>
                </div>
            </div>
            <aside id="drawer" class="drawer"></aside>
        </div>
    </div>

    <div id="toast" class="toast" hidden role="status"></div>
    <div id="floatbar" class="floatbar" hidden></div>
    <div id="crop-dialog" class="crop-dialog" hidden>
        <div class="crop-card" role="dialog" aria-modal="true" aria-labelledby="crop-title">
            <h2 id="crop-title" data-i18n="photo.title"></h2>
            <p class="setup-lead" data-i18n="photo.hint"></p>
            <button type="button" class="btn" id="crop-change" data-i18n="photo.replace"></button>
            <div class="crop-stage"><img id="crop-image" alt=""></div>
            <div class="crop-row">
                <span id="crop-page-label" data-i18n="photo.onPage"></span>
                <input id="crop-page-size" type="range" min="36" max="100" step="2" aria-labelledby="crop-page-label">
                <span id="crop-page-value"></span>
                <button type="button" class="btn" id="crop-page-max" data-i18n="photo.max"></button>
                <button type="button" class="btn" id="crop-page-reset" data-i18n="photo.reset"></button>
            </div>
            <div class="crop-row">
                <span id="crop-zoom-label" data-i18n="photo.inFrame"></span>
                <input id="crop-zoom" type="range" min="10" max="300" step="1" aria-labelledby="crop-zoom-label">
                <span id="crop-zoom-value"></span>
                <button type="button" class="btn" id="crop-fit" data-i18n="photo.fit"></button>
                <button type="button" class="btn" id="crop-fill" data-i18n="photo.max"></button>
                <button type="button" class="btn" id="crop-reset" data-i18n="photo.reset"></button>
            </div>
            <div class="crop-aspects">
                <button type="button" class="btn" data-aspect="0.75" data-i18n="photo.portrait"></button>
                <button type="button" class="btn" data-aspect="1" data-i18n="photo.square"></button>
                <button type="button" class="btn" data-aspect="1.333" data-i18n="photo.wide"></button>
            </div>
            <div class="guide-actions">
                <button type="button" class="btn" id="crop-cancel" data-i18n="photo.cancel"></button>
                <button type="button" class="btn-primary" id="crop-apply" data-i18n="photo.use"></button>
            </div>
        </div>
    </div>
    <input id="photo-file" type="file" accept="image/*" hidden>
    <script src="vendor/cropper.min.js"></script>
    <script src="editor.js"></script>
</body>
</html>
